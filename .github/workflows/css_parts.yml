# Fails if any component renders a `part="…"` attribute with no matching `@csspart`, or
# documents a `@csspart` that nothing renders, keeping the rendered and documented CSS part
# surfaces from drifting apart. Static analysis only — no build or dev server needed.

name: CSS Parts

permissions:
  contents: read

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

jobs:
  css_parts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check CSS part coverage
        run: npm run test:parts
        working-directory: ./packages/webawesome

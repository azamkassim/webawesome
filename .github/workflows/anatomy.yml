# Fails if a component doc flags an anatomy example the diagram can't use (the flagged block lacks the
# component's tag, or the page has no diagram). Static analysis only — no build or dev server needed.

name: Anatomy

permissions:
  contents: read

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

jobs:
  anatomy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check anatomy examples
        run: npm run test:anatomy
        working-directory: ./packages/webawesome
